version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: mcp_readonly
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"

  mcp-query-server:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

