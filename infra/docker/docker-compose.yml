  postgres-primary:
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    container_name: postgres-primary
    hostname: postgres-node-1
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres
      POSTGRESQL_USERNAME: cmicadmin
      POSTGRESQL_PASSWORD: Scuti@12345
      POSTGRESQL_DATABASE: db_ec
      REPMGR_PASSWORD: repmgrsecret
      REPMGR_PRIMARY_HOST: postgres-node-1
      REPMGR_PARTNER_NODES: postgres-node-1,postgres-node-2,postgres-node-3
      REPMGR_NODE_NAME: postgres-node-1
      REPMGR_NODE_NETWORK_NAME: postgres-node-1
      REPMGR_NODE_ID: "1"
    ports:
      - "5432:5432"
    volumes:
      - db-primary-data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_ec -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-replica-1:
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    container_name: postgres-rep1
    hostname: postgres-node-2
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres
      POSTGRESQL_USERNAME: cmicadmin
      POSTGRESQL_PASSWORD: Scuti@12345
      POSTGRESQL_DATABASE: db_ec
      REPMGR_PASSWORD: repmgrsecret
      REPMGR_PRIMARY_HOST: postgres-node-1
      REPMGR_PARTNER_NODES: postgres-node-1,postgres-node-2,postgres-node-3
      REPMGR_NODE_NAME: postgres-node-2
      REPMGR_NODE_NETWORK_NAME: postgres-node-2
      REPMGR_NODE_ID: "2"
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    volumes:
      - db-replica-1-data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_ec -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-replica-2:
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    container_name: postgres-rep2
    hostname: postgres-node-3
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres
      POSTGRESQL_USERNAME: cmicadmin
      POSTGRESQL_PASSWORD: Scuti@12345
      POSTGRESQL_DATABASE: db_ec
      REPMGR_PASSWORD: repmgrsecret
      REPMGR_PRIMARY_HOST: postgres-node-1
      REPMGR_PARTNER_NODES: postgres-node-1,postgres-node-2,postgres-node-3
      REPMGR_NODE_NAME: postgres-node-3
      REPMGR_NODE_NETWORK_NAME: postgres-node-3
      REPMGR_NODE_ID: "3"
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5434:5432"
    volumes:
      - db-replica-2-data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_ec -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: otel-collector
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

volumes:
  db-primary-data:
    driver: local
  db-replica-1-data:
    driver: local
  db-replica-2-data:
    driver: local
