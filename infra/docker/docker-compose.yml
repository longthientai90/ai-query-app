services:
  mcp-query-server:
    build:
      context: ../../apps/mcp-query-server
      dockerfile: Dockerfile
    container_name: mcp-query-server
    env_file:
      - ../../apps/mcp-query-server/.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_TRANSPORT: http
    ports:
      - "8000:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-core:
    build:
      context: ../../apps/agent-core
      dockerfile: Dockerfile
    container_name: agent-core
    env_file:
      - ../../apps/agent-core/.env
    environment:
      AGENT_CORE_HOST: 0.0.0.0
      AGENT_CORE_PORT: 8100
      MCP_SERVER_TRANSPORT: http
      MCP_SERVER_URL: http://mcp-query-server:8000/mcp
    depends_on:
      - mcp-query-server
    ports:
      - "8100:8100"
    restart: unless-stopped

  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    env_file:
      - ../../apps/api-gateway/.env
    environment:
      API_GATEWAY_HOST: 0.0.0.0
      API_GATEWAY_PORT: 8080
      AGENT_CORE_BASE_URL: http://agent-core:8100
      AGENT_CORE_HANDLE_PATH: /agent/handle
    depends_on:
      - agent-core
    ports:
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16.11
    container_name: postgres_16

    environment:
      POSTGRES_USER: cmicadmin
      POSTGRES_PASSWORD: Scuti@12345
      POSTGRES_DB: dify_platform

    ports:
      - "5432:5432"

    volumes:
      - ./.volumes/pg:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cmicadmin" ]
      interval: 10s
      timeout: 5s
      retries: 5
