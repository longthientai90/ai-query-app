services:
  mcp-query-server:
    build:
      context: ../../apps/mcp-query-server
      dockerfile: Dockerfile
    container_name: mcp-query-server
    environment:
      DATABASE_URL: postgresql://cmicadmin:Scuti%4012345@postgres-primary:5432/db_ec
      READONLY_DATABASE_URLS: postgresql://cmicadmin:Scuti%4012345@postgres-replica-1:5432/db_ec,postgresql://cmicadmin:Scuti%4012345@postgres-replica-2:5432/db_ec
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_TRANSPORT: http
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: mcp-query-server
    ports:
      - "8000:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy
      otel-collector:
        condition: service_started

  service-schema:
    build:
      context: ../../apps/service-schema
      dockerfile: Dockerfile
    container_name: service-schema
    environment:
      SERVICE_SCHEMA_HOST: 0.0.0.0
      SERVICE_SCHEMA_PORT: 8200
      DATABASE_URL: postgresql://cmicadmin:Scuti%4012345@postgres-primary:5432/db_ec
      DB_POOL_MIN: 1
      DB_POOL_MAX: 5
      DB_STATEMENT_TIMEOUT_MS: 15000
      DB_SCHEMA_NAME: public
      AUTO_REINDEX_ON_STARTUP: "true"
      REINDEX_INCLUDE_INDEXES: "true"
      DEFAULT_MAX_TABLES: 5
      MAX_SEARCH_TABLES: 12
      MAX_COLUMNS_PER_TABLE: 8
      MAX_CONTEXT_CHARS: 6000
      LOW_SIGNAL_TABLE_PATTERNS: log,logs,audit,audits,event,events,config,configs,temp,tmp
      SCHEMA_ALIAS_OVERRIDES: '{}'
      SCHEMA_TAG_OVERRIDES: '{}'
      QDRANT_ENABLED: "false"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: schema-documents
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: service-schema
    ports:
      - "8200:8200"
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      qdrant:
        condition: service_started
      otel-collector:
        condition: service_started

  agent-core:
    build:
      context: ../../apps/agent-core
      dockerfile: Dockerfile
    container_name: agent-core
    environment:
      AGENT_CORE_HOST: 0.0.0.0
      AGENT_CORE_PORT: 8100
      MCP_SERVER_TRANSPORT: http
      MCP_SERVER_URL: http://mcp-query-server:8000/mcp
      SERVICE_SCHEMA_BASE_URL: http://service-schema:8200
      SERVICE_SCHEMA_SEARCH_PATH: /schema/search
      SERVICE_SCHEMA_REINDEX_PATH: /schema/reindex
      SERVICE_SCHEMA_TIMEOUT_SEC: 60
      SERVICE_SCHEMA_MAX_TABLES: 6
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: agent-core
    depends_on:
      mcp-query-server:
        condition: service_started
      service-schema:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8100:8100"
    restart: unless-stopped

  # api-gateway:
  #   build:
  #     context: ../../apps/api-gateway
  #     dockerfile: Dockerfile
  #   container_name: api-gateway
  #   env_file:
  #     - ../../apps/api-gateway/.env
  #   environment:
  #     API_GATEWAY_HOST: 0.0.0.0
  #     API_GATEWAY_PORT: 8080
  #     AGENT_CORE_BASE_URL: http://agent-core:8100
  #     AGENT_CORE_HANDLE_PATH: /agent/handle
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  #     OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  #     OTEL_TRACES_SAMPLER: always_on
  #     OTEL_SERVICE_NAME: api-gateway
  #   depends_on:
  #     - agent-core
  #     - otel-collector
  #   ports:
  #     - "8080:8080"
  #   restart: unless-stopped

  postgres-primary:
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    container_name: postgres-primary
    hostname: postgres-node-1
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres
      POSTGRESQL_USERNAME: cmicadmin
      POSTGRESQL_PASSWORD: Scuti@12345
      POSTGRESQL_DATABASE: db_ec
      REPMGR_PASSWORD: repmgrsecret
      REPMGR_PRIMARY_HOST: postgres-node-1
      REPMGR_PARTNER_NODES: postgres-node-1,postgres-node-2,postgres-node-3
      REPMGR_NODE_NAME: postgres-node-1
      REPMGR_NODE_NETWORK_NAME: postgres-node-1
      REPMGR_NODE_ID: "1"
    ports:
      - "5432:5432"
    volumes:
      - db-primary-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d db_ec -h 127.0.0.1 -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-replica-1:
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    container_name: postgres-rep1
    hostname: postgres-node-2
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres
      POSTGRESQL_USERNAME: cmicadmin
      POSTGRESQL_PASSWORD: Scuti@12345
      POSTGRESQL_DATABASE: db_ec
      REPMGR_PASSWORD: repmgrsecret
      REPMGR_PRIMARY_HOST: postgres-node-1
      REPMGR_PARTNER_NODES: postgres-node-1,postgres-node-2,postgres-node-3
      REPMGR_NODE_NAME: postgres-node-2
      REPMGR_NODE_NETWORK_NAME: postgres-node-2
      REPMGR_NODE_ID: "2"
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    volumes:
      - db-replica-1-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d db_ec -h 127.0.0.1 -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-replica-2:
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    container_name: postgres-rep2
    hostname: postgres-node-3
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: postgres
      POSTGRESQL_USERNAME: cmicadmin
      POSTGRESQL_PASSWORD: Scuti@12345
      POSTGRESQL_DATABASE: db_ec
      REPMGR_PASSWORD: repmgrsecret
      REPMGR_PRIMARY_HOST: postgres-node-1
      REPMGR_PARTNER_NODES: postgres-node-1,postgres-node-2,postgres-node-3
      REPMGR_NODE_NAME: postgres-node-3
      REPMGR_NODE_NETWORK_NAME: postgres-node-3
      REPMGR_NODE_ID: "3"
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5434:5432"
    volumes:
      - db-replica-2-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d db_ec -h 127.0.0.1 -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    # qdrant/qdrant:v1.16.3-gpu-nvidia
    image: qdrant/qdrant:v1.16.3
    container_name: db_schema_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: otel-collector
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

volumes:
  db-primary-data:
    driver: local
  db-replica-1-data:
    driver: local
  db-replica-2-data:
    driver: local
  qdrant_data:
    driver: local
